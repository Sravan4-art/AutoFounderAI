<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FitMind AI - AI-Driven Fitness App</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
:root{
    --primary:#00c7b7;
    --secondary:#0d1f2d;
    --accent:#f2f2f2;
    --bg:#ffffff;
    --text:#333333;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
    font-family:Arial,Helvetica,sans-serif;
    color:var(--text);
    background:var(--bg);
    line-height:1.6;
}
html{scroll-behavior:smooth;}
/* Navigation */
header{
    background:var(--secondary);
    position:fixed;
    width:100%;
    top:0;left:0;
    z-index:1000;
}
.navbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:1rem 2rem;
}
.logo{
    color:#fff;
    font-size:1.5rem;
    font-weight:bold;
}
.nav-links{
    display:flex;
    gap:1.5rem;
}
.nav-links a{
    color:#fff;
    text-decoration:none;
    font-size:1rem;
    position:relative;
}
.nav-links a::after{
    content:"";
    position:absolute;
    width:0;height:2px;
    left:0;
    bottom:-4px;
    background:var(--primary);
    transition:width 0.3s;
}
.nav-links a:hover::after{width:100%;}
.hamburger{
    display:none;
    flex-direction:column;
    gap:5px;
    cursor:pointer;
}
.hamburger span{
    width:25px;height:3px;background:#fff;
}
@media(max-width:768px){
    .nav-links{
        position:absolute;
        top:100%;
        left:0;
        flex-direction:column;
        background:var(--secondary);
        width:100%;
        max-height:0;
        overflow:hidden;
        transition:max-height 0.3s;
    }
    .nav-links.open{max-height:300px;}
    .hamburger{display:flex;}
}
/* Hero Section */
.hero{
    height:100vh;
    background:url('https://images.unsplash.com/photo-1554286536-6f4c8f7f6e1d?auto=format&fit=crop&w=1400&q=80') center/cover no-repeat;
    position:relative;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:0 1rem;
}
.hero::before{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(13,31,45,0.6);
}
.hero-content{
    position:relative;
    z-index:1;
    max-width:800px;
}
.hero h1{font-size:3rem;margin-bottom:0.5rem;}
.hero p{font-size:1.5rem;margin-bottom:1.5rem;}
.cta-btn{
    display:inline-block;
    padding:0.75rem 1.5rem;
    background:var(--primary);
    color:#fff;
    text-decoration:none;
    font-size:1rem;
    border-radius:5px;
    transition:transform 0.3s;
}
.cta-btn:hover{transform:scale(1.05);}
/* Section Styles */
section{padding:4rem 2rem;}
section:nth-child(even){background:var(--accent);}
.section-title{
    text-align:center;
    margin-bottom:2rem;
    font-size:2rem;
    color:var(--secondary);
}
.card-grid{
    display:grid;
    gap:1.5rem;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
}
.card{
    background:#fff;
    border-radius:8px;
    box-shadow:0 4px 6px rgba(0,0,0,0.1);
    padding:1.5rem;
    text-align:center;
    transition:transform 0.3s;
    animation:fadeInUp 0.6s forwards;
    opacity:0;
}
.card:hover{transform:translateY(-5px);}
@keyframes fadeInUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
/* Features */
.features .icon{font-size:3rem;color:var(--primary);margin-bottom:1rem;}
/* Why Choose Us */
.choose-list{list-style:none;line-height:1.8;}
.choose-list li{padding-left:25px;position:relative;}
.choose-list li::before{
    content:"✔";
    position:absolute;
    left:0;
    color:var(--primary);
}
/* How It Works */
.steps{counter-reset:step;}
.step-item{display:flex;gap:1rem;align-items:flex-start;padding:1rem 0;}
.step-item::before{
    counter-increment:step;
    content:counter(step);
    background:var(--primary);
    color:#fff;
    border-radius:50%;
    width:30px;height:30px;
    display:flex;align-items:center;justify-content:center;
    font-weight:bold;
}
.step-content{flex:1;}
/* Testimonials */
.testimonial{
    background:var(--secondary);
    color:#fff;
    border-radius:8px;
    padding:2rem;
    position:relative;
}
.testimonial img{
    width:60px;height:60px;border-radius:50%;
    object-fit:cover;margin-bottom:1rem;
}
.testimonial p{font-style:italic;margin:1rem 0;}
.testimonial .name{font-weight:bold;}
/* Pricing */
.pricing-table{display:grid;gap:1.5rem;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));}
.pricing-card{
    background:#fff;border-radius:8px;box-shadow:0 4px 6px rgba(0,0,0,0.1);
    padding:2rem;text-align:center;transition:transform 0.3s;
}
.pricing-card:hover{transform:translateY(-5px);}
.pricing-card h3{margin-bottom:1rem;font-size:1.5rem;color:var(--secondary);}
.pricing-card .price{font-size:2rem;margin:1rem 0;}
.pricing-card ul{list-style:none;margin:1rem 0;}
.pricing-card ul li{margin:0.5rem 0;}
.pricing-card button{
    background:var(--primary);
    color:#fff;
    border:none;
    padding:0.75rem 1.5rem;
    border-radius:5px;
    cursor:pointer;
    transition:background 0.3s;
}
.pricing-card button:hover{background:#009999;}
/* FAQ Accordion */
.accordion{
    border:1px solid #ddd;
    border-radius:5px;
    overflow:hidden;
}
.accordion-item{border-bottom:1px solid #ddd;}
.accordion-item:last-child{border-bottom:none;}
.accordion-header{
    padding:1rem;
    cursor:pointer;
    background:#f9f9f9;
    display:flex;justify-content:space-between;align-items:center;
}
.accordion-content{
    max-height:0;
    overflow:hidden;
    transition:max-height 0.3s;
    padding:0 1rem;
}
.accordion-item.active .accordion-content{max-height:200px;padding:1rem;}
.accordion-item.active .accordion-header{background:#e9e9e9;}
.accordion-header::after{content:"▾";font-size:1.2rem;}
.accordion-item.active .accordion-header::after{content:"▴";}
.accordion-content p{margin-bottom:0.5rem;}
/* Contact */
form{display:grid;gap:1rem;}
form input,form textarea{padding:0.75rem;border:1px solid #ccc;border-radius:5px;width:100%;}
form button{background:var(--primary);color:#fff;border:none;padding:0.75rem;border-radius:5px;cursor:pointer;font-size:1rem;}
form button:hover{background:#009999;}
/
